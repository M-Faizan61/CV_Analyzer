# Keep the app on this computer only, and on its own port.
[server]
address = "127.0.0.1"
port = 8520
maxUploadSize = 10
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1F2933"
font = "sans serif"
